server {
    listen 8080;
    server_name _;

    root /root/chainbaas/dist;
    index index.html;

    location /pipeline/compile_solidity/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /api/shard2/ {
        proxy_pass https://127.0.0.1:22001/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/shard3/ {
        proxy_pass https://127.0.0.1:23001/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/shard4/ {
        proxy_pass https://127.0.0.1:24001/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/shard5/ {
        proxy_pass https://127.0.0.1:25001/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/shard6/ {
        proxy_pass https://127.0.0.1:26001/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
